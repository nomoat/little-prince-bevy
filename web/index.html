<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1229">
<title>小王子 · 星辰之旅</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1229; overflow: hidden; overscroll-behavior: none; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #game { position: fixed; inset: 0; }
  canvas#bevy { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
  #veil { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
          background: radial-gradient(ellipse at 50% 40%, #1d2552 0%, #0d1229 70%); color: #f6e7c1;
          font-family: "Songti SC", "Noto Serif SC", Georgia, serif; transition: opacity .8s ease; z-index: 10; }
  #veil h1 { font-weight: normal; letter-spacing: .3em; margin: 0 0 .4em; font-size: clamp(28px, 6vw, 56px); }
  #veil p { margin: .3em; opacity: .75; font-size: clamp(13px, 2.4vw, 17px); }
  #bar { width: min(60vw, 360px); height: 3px; background: rgba(255,255,255,.15); border-radius: 2px; margin-top: 1.4em; overflow: hidden; }
  #bar > div { height: 100%; width: 0; background: #f0c23a; transition: width .2s; }
  #veil.gone { opacity: 0; pointer-events: none; }
  #err { color: #ffb4a8; max-width: 80vw; text-align: center; }
</style>
</head>
<body>
<div id="game"><canvas id="bevy" tabindex="0"></canvas></div>
<div id="veil"><h1>小王子</h1><p>星辰之旅 · The Little Prince</p><div id="bar"><div></div></div><p id="msg">正在加载… Loading…</p><p id="err"></p></div>
<script>
  // Web audio needs a user gesture: track every AudioContext and resume them
  // on the first tap / key press.
  (function () {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    const all = [];
    function Tracked(...a) { const c = new C(...a); all.push(c); return c; }
    Tracked.prototype = C.prototype;
    window.AudioContext = Tracked; window.webkitAudioContext = Tracked;
    const resume = () => all.forEach(c => c.state !== 'running' && c.resume());
    ['pointerdown', 'keydown', 'touchend'].forEach(e => window.addEventListener(e, resume, { capture: true }));
  })();
  document.addEventListener('contextmenu', e => e.preventDefault());
  window.__lpReady = () => {
    const v = document.getElementById('veil');
    v.classList.add('gone');
    setTimeout(() => v.remove(), 900);
    document.getElementById('bevy').focus();
  };
</script>
<script type="module">
  import init from './little_prince.js';
  const bar = document.querySelector('#bar > div');
  const msg = document.getElementById('msg');
  async function fetchWithProgress(url) {
    const res = await fetch(url);
    // build_web.sh writes the uncompressed size into WASM_SIZE (hosts that
    // compress send the compressed content-length, which would be too small).
    const WASM_SIZE = +'__WASM_SIZE__' || 0;
    const total = +(res.headers.get('x-raw-length')) || WASM_SIZE || +res.headers.get('content-length') || 0;
    if (!res.body || !total) return res;
    const reader = res.body.getReader();
    const chunks = []; let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); got += value.length;
      bar.style.width = Math.min(100, got / total * 100).toFixed(1) + '%';
      msg.textContent = `正在加载… ${(got / 1048576).toFixed(1)} / ${(total / 1048576).toFixed(1)} MB`;
    }
    return new Response(new Blob(chunks, { type: 'application/wasm' }), { headers: { 'content-type': 'application/wasm' } });
  }
  try {
    const wasm = await fetchWithProgress('./little_prince_bg.wasm');
    msg.textContent = '正在启动… Starting…';
    await init({ module_or_path: wasm });
  } catch (e) {
    // winit uses an exception to hand control to the browser's event loop.
    if (!String(e).includes('Using exceptions for control flow')) {
      document.getElementById('err').textContent = String(e);
      console.error(e);
    }
  }
</script>
</body>
</html>
